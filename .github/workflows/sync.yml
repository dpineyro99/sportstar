name: Captura de mercado

# Por qué GitHub Actions y no un cron en el entorno de desarrollo: ese contenedor
# es efímero y muere con la sesión. Esto corre en infraestructura de GitHub y
# sobrevive a todo.
#
# Ventana 16:00-04:00 UTC: cubre desde los partidos de mediodía en la costa este
# hasta los nocturnos de la oeste. Trece capturas al día.
#
# Coste medido: 1 crédito por captura (h2h, región us), leído de
# x-requests-remaining en una respuesta real. 13/día x 30 = 390 al mes, dentro
# de los 500 del plan gratuito con margen para ejecuciones manuales.
#
# IMPORTANTE: los eventos `schedule` de GitHub solo disparan en la rama por
# defecto. Este fichero tiene que estar en `main` para que la captura arranque.
on:
  schedule:
    - cron: "0 16,17,18,19,20,21,22,23,0,1,2,3,4 * * *"
  workflow_dispatch:

# Sin esto el job no puede escribir los snapshots de vuelta al repositorio.
permissions:
  contents: write

concurrency:
  # Dos capturas simultáneas chocarían al hacer push. Se descarta la nueva en
  # vez de cancelar la que ya está escribiendo.
  group: market-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar
        run: pip install -e .

      - name: Capturar
        env:
          SPORTSTAR_ODDS_API_KEY: ${{ secrets.SPORTSTAR_ODDS_API_KEY }}
        run: python -m sportstar.cli sync

      - name: Guardar el snapshot
        run: |
          if [ -z "$(git status --porcelain data/raw/snapshots)" ]; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/snapshots
          git commit -m "snapshot de mercado $(date -u +'%Y-%m-%d %H:%M')Z"
          # Reintento con rebase: dos capturas seguidas pueden solaparse y la
          # segunda debe reconstruirse sobre la primera, nunca pisarla.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "No se pudo guardar el snapshot tras 3 intentos"
          exit 1
