name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Types
        run: mypy
      - name: Tests
        # El núcleo matemático es la única parte donde un bug no lanza excepción:
        # contamina en silencio cada número aguas abajo. De ahí el umbral duro.
        run: |
          pytest -q \
            --cov=sportstar.core --cov=sportstar.validation \
            --cov-report=term-missing --cov-fail-under=95
      - name: Migrations round-trip
        env:
          SPORTSTAR_DATABASE_URL: sqlite:///ci.db
        run: |
          alembic upgrade head
          alembic downgrade base
